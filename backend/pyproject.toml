[project]
name = "graphrev"
version = "0.1.0"
description = "GraphRev — semantic function graph for binary reverse engineering"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "structlog>=24.1",
  "typer>=0.12",
  "httpx>=0.27",
  "litellm>=1.40",
]

[project.scripts]
graphrev = "graphrev.cli.__main__:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.1",
  "freezegun>=1.5",
  "anyio>=4.6",
  "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrev"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
"migrations/**" = ["ANN", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["graphrev"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = "graphrev.cli.*"
disallow_untyped_decorators = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

# ---------------------------------------------------------------------------
# import-linter — enforces TAD §2.2 layering
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["graphrev"]

[[tool.importlinter.contracts]]
name = "Layers: api -> services -> repositories -> db"
type = "layers"
layers = [
  "graphrev.api",
  "graphrev.services",
  "graphrev.repositories",
  "graphrev.db",
]

[[tool.importlinter.contracts]]
name = "Services must not import api"
type = "forbidden"
source_modules = ["graphrev.services"]
forbidden_modules = ["graphrev.api"]

[[tool.importlinter.contracts]]
name = "Repositories must not import services or summarization"
type = "forbidden"
source_modules = ["graphrev.repositories"]
forbidden_modules = ["graphrev.services", "graphrev.summarization"]

[[tool.importlinter.contracts]]
name = "Only adapters/*/base may be imported outside their own package"
type = "forbidden"
# allow_indirect_imports: callers select a concrete adapter via the factory
# function in `adapters/ghidra/__init__.py` (`create_adapter`), which is the
# one sanctioned place that imports `.mock`/`.rest` directly. Every other
# module reaches `.mock`/`.rest` only indirectly, through that factory —
# without this flag, import-linter would (correctly, but too strictly for
# this design) flag `graphrev.cli -> graphrev.adapters.ghidra ->
# graphrev.adapters.ghidra.mock` as broken even though `cli` never imports
# `.mock` itself.
allow_indirect_imports = true
source_modules = [
  "graphrev.api",
  "graphrev.services",
  "graphrev.repositories",
  "graphrev.db",
  "graphrev.summarization",
  "graphrev.classification",
  "graphrev.events",
  "graphrev.ingestion",
  "graphrev.cli",
]
forbidden_modules = [
  "graphrev.adapters.ghidra.mock",
  "graphrev.adapters.ghidra.rest",
  "graphrev.adapters.llm.mock",
  "graphrev.adapters.llm.litellm_adapter",
  "graphrev.adapters.llm.opencode_adapter",
]
